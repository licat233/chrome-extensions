<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIC Product Assistant</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="popup-header">
        <div class="title-wrap">
          <span class="app-mark" aria-hidden="true">M</span>
          <div>
            <p class="eyebrow">Made-in-China</p>
            <h1>MIC产品助手</h1>
          </div>
        </div>
        <button id="pasteAndFill" class="button button-compact" type="button">
          读取并填充
        </button>
      </header>

      <section class="editor-shell" aria-label="产品资料">
        <div class="editor-top">
          <span>产品资料</span>
          <span>字段名：字段值</span>
        </div>
        <textarea id="bulkText" spellcheck="false" placeholder="可粘贴 Bulk Fill 文本，也可提取当前产品 Context 或导出类别表单 Schema。"></textarea>
      </section>

      <div class="actions">
        <button id="extract" class="button" type="button">提取当前产品</button>
        <button id="extractSchema" class="button" type="button">导出类别表单</button>
        <button id="fill" class="button" type="button">填充当前页面</button>
        <button id="clear" class="button" type="button">清空输入框</button>
      </div>

      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-label">正在填充...</div>
        <div class="progress-track" role="progressbar" aria-label="填充进度">
          <div class="progress-bar"></div>
        </div>
      </div>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
