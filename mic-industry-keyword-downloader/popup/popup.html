<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIC 行业关键词批量下载</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="eyebrow">MADE-IN-CHINA · 数据罗盘</div>
    <h1>行业关键词批量下载</h1>
    <p>每个行业与月份生成一份原生 XLSX，内含行业热词和行业趋势词。</p>
  </header>

  <main>
    <div id="message" class="message" role="status">正在读取当前页面…</div>
    <div id="picker-notice" class="picker-notice" role="status" hidden>
      <strong>需要启用文件夹访问功能</strong>
      <p>当前浏览器没有提供文件夹选择功能。Brave 默认关闭该功能，因此暂时无法设置保存路径。</p>
      <p>在地址栏打开 <code>brave://flags/#file-system-access-api</code>，将 <b>File System Access API</b> 设为 <b>Enabled</b>，然后重启 Brave。</p>
      <p>此设置对整个浏览器生效；网站访问文件时仍需你授权。</p>
    </div>
    <div class="save-setting"><span id="save-location">保存位置：未设置</span><button id="settings" type="button">设置保存路径</button></div>

    <section id="form" hidden>
      <div class="section-title"><h2>月份</h2><span id="region"></span></div>
      <div id="months" class="months"></div>

      <div class="section-title industry-title"><h2>行业</h2><span id="industry-count"></span></div>
      <input id="search" class="search" type="search" placeholder="搜索已设置的行业" aria-label="搜索行业">
      <div class="quick-actions">
        <button id="select-visible" type="button">全选当前结果</button>
        <button id="clear" type="button">清空选择</button>
      </div>
      <div id="industries" class="industries"></div>
      <div class="summary" id="summary"></div>
      <button id="start" class="primary" type="button">开始下载</button>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
    </section>

    <section id="progress" class="progress" hidden>
      <div class="section-title"><h2>下载进度</h2><span id="progress-count"></span></div>
      <progress id="progress-bar" max="1" value="0"></progress>
      <p id="current-file" class="current-file"></p>
      <p id="failures" class="failures"></p>
      <div class="progress-actions">
        <button id="pause" type="button">暂停</button>
        <button id="resume" type="button" hidden>继续</button>
      </div>
    </section>
  </main>

  <script src="../directory-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
