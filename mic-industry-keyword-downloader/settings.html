<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置下载保存路径</title><link rel="stylesheet" href="settings.css"></head>
<body><main><p class="eyebrow">MIC 行业关键词批量下载</p><h1>设置下载保存路径</h1><p>选择一个文件夹。每次下载时，插件会在该文件夹内新建独立任务文件夹，并按月份保存报表。</p><div class="card"><div class="label">当前保存位置</div><strong id="location">正在读取…</strong><p id="status" role="status"></p><div class="actions"><button id="choose" type="button">选择文件夹</button><button id="authorize" type="button" hidden>重新授权</button></div></div><p class="hint">浏览器只向插件提供文件夹名称，不显示完整路径。Chrome 重启后可能需要重新授权。下载进行中不能更改保存位置。</p></main><script src="directory-store.js"></script><script src="settings.js"></script></body></html>
