name: Package and release MIC Industry Keyword Downloader

on:
  push:
    branches:
      - main
    paths:
      - "mic-industry-keyword-downloader/manifest.json"
      - ".github/workflows/mic-industry-keyword-downloader-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./mic-industry-keyword-downloader/manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        shell: bash
        run: |
          mkdir -p dist
          zip -qr "dist/MIC-Industry-Keyword-Downloader.zip" mic-industry-keyword-downloader -x '*/.DS_Store'
          unzip -t "dist/MIC-Industry-Keyword-Downloader.zip"
          unzip -Z1 "dist/MIC-Industry-Keyword-Downloader.zip" | grep -qx 'mic-industry-keyword-downloader/manifest.json'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          NOTES="Download MIC-Industry-Keyword-Downloader.zip, extract it, open chrome://extensions, enable Developer mode, and choose the extracted mic-industry-keyword-downloader folder."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/MIC-Industry-Keyword-Downloader.zip" --clobber
          else
            gh release create "$TAG" "dist/MIC-Industry-Keyword-Downloader.zip" \
              --title "MIC 行业关键词批量下载 $TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
