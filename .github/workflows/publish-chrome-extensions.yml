name: Publish Chrome Extension Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave empty to use date-based default)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-chrome-extensions.yml"

permissions:
  contents: write

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release: publish Chrome extension packages') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="extensions-$(date -u +%Y.%m.%d)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist stage
          mkdir -p dist stage

          package_extension() {
            local src="$1"
            local package_name="$2"
            shift 2

            local version
            version="$(jq -r '.version' "$src/manifest.json")"
            local folder="${package_name}-v${version}"
            local target="stage/${folder}"
            mkdir -p "$target"

            for item in "$@"; do
              cp -R "$src/$item" "$target/"
            done

            cat > "$target/INSTALL.txt" <<'EOF'
          Chrome installation:
          1. Extract this ZIP.
          2. Open chrome://extensions/
          3. Enable Developer mode.
          4. Click "Load unpacked".
          5. Select this extracted extension folder.
          EOF

            (
              cd stage
              zip -qr "../dist/${folder}.zip" "$folder"
            )
          }

          package_extension \
            "armor-form-extractor" \
            "armor-form-extractor" \
            manifest.json content.js popup.html popup.css popup.js icon.png armor-icon.svg css webfonts

          package_extension \
            "mic-product-assistant" \
            "mic-product-assistant" \
            manifest.json content.js popup.html popup.css popup.js icons

          package_extension \
            "mic-video-link-downloader" \
            "mic-video-link-downloader" \
            manifest.json background.js popup.html popup.js styles.css icons

          (
            cd dist
            sha256sum *.zip > SHA256SUMS.txt
          )

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Chrome Extensions Pack — __RELEASE_DATE__
          
          独立下载包：
          
          - **ARMOR Form Extractor v__FORM_VERSION__**
          - **MIC Product Assistant v__MIC_VERSION__**
            - 支持导出当前产品 Context
            - 支持导出 `mic-category-form-schema/v1`
            - 可用于 EAO 的 MIC Category Form Schema 工作流
            - v0.3.1：最多回填 12 组 FAQ（由页面实际可添加行数决定）
            - v0.3.1：标准属性匹配失败且没有自定义输入框时，不再虚报成功
            - v0.3.2：支持提取并回填运费模板，导出自定义属性新增能力与页面容量
            - v0.3.3：当 MIC 当前下拉选项真实包含 Other 时，支持直接选择该合法选项
            - v0.3.3：产品 Context 新增 `explicitOtherOptionSupported: true`，旧 Context 需重新提取
          - **MIC Course Video Link Downloader v__VIDEO_VERSION__**
          
          ## 安装
          
          1. 下载需要的 ZIP；
          2. 解压；
          3. 打开 `chrome://extensions/`；
          4. 开启“开发者模式”；
          5. 点击“加载已解压的扩展程序”；
          6. 选择解压后的插件目录。
          7. 更新后在 chrome://extensions/ 重新加载插件，并刷新 MIC 产品编辑页。
          
          Release ZIP 只包含 Chrome 运行所需文件，不包含仓库中的开发补丁、Hermes Skill、MHTML 调试资料等开发文件。
          EOF
          sed -i "s/__RELEASE_DATE__/$(date -u +%Y-%m-%d)/g" RELEASE_NOTES.md
          sed -i "s/__FORM_VERSION__/$(jq -r '.version' armor-form-extractor/manifest.json)/g" RELEASE_NOTES.md
          sed -i "s/__MIC_VERSION__/$(jq -r '.version' mic-product-assistant/manifest.json)/g" RELEASE_NOTES.md
          sed -i "s/__VIDEO_VERSION__/$(jq -r '.version' mic-video-link-downloader/manifest.json)/g" RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Chrome Extensions Pack — $(date -u +%Y-%m-%d)" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Chrome Extensions Pack — $(date -u +%Y-%m-%d)" \
              --notes-file RELEASE_NOTES.md
          fi
